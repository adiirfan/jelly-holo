[package]
name = "jellytorrent"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "jellytorrent"
crate-type = ["cdylib", "rlib"]

[dependencies]
librqbit = { version = "=9.1.0", default-features = false, features = ["rust-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
# The certificate checker speaks the newer bridge; only its setup call uses it
jni22 = { package = "jni", version = "0.22" }
rustls-platform-verifier = "0.7"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
panic = "unwind"
strip = true
