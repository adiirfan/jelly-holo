# SPDX-License-Identifier: Apache-2.0

version = 1
SPDX-PackageName = "Jelly"
SPDX-PackageSupplier = "The LineageOS Project"
SPDX-PackageDownloadLocation = "https://github.com/LineageOS/android_packages_apps_Jelly"

[[annotations]]
path = [".github/workflows/**", ".gitignore", "app/.gitignore", "app/schemas/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "The LineageOS Project"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "gradle/wrapper/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2007-2023 Gradle, Inc."
SPDX-License-Identifier = "Apache-2.0"

# Jelly Holo's own Rust code: the ad blocker and the torrent engine
[[annotations]]
path = ["blocker/**", "torrent/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "Jelly Holo contributors"
SPDX-License-Identifier = "MIT"

# Third-party licence texts, as published by their projects
[[annotations]]
path = "licenses/**"
precedence = "override"
SPDX-FileCopyrightText = "Their respective authors"
SPDX-License-Identifier = "LicenseRef-third-party-notices"
